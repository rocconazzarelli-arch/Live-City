version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    groups:
      expo-sdk-patches:
        patterns:
          - expo
          - "expo-*"
          - "@expo/*"
        update-types:
          - patch
    ignore:
      # Expo packages must stay on the SDK 57 major until the application is
      # deliberately migrated using the matching Expo upgrade guide.
      - dependency-name: "expo"
        update-types:
          - version-update:semver-major
      - dependency-name: "expo-*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "eslint-config-expo"
        update-types:
          - version-update:semver-major
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-native"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react*"
        update-types:
          - version-update:semver-major
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
